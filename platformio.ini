; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ==============================================================================
; RMII Ethernet TLS test — standalone sketch, no main project dependencies
; Edit src/samples/rmii_tls_test.cpp to set broker/certs before flashing.
; ==============================================================================
[env:m5tab5-tls-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino

build_flags =
    -DCONFIG_IDF_TARGET_ESP32P4=1
    -DARDUINO_M5TAB5=1

build_src_filter = +<samples/rmii_tls_test.cpp>

monitor_speed = 115200
upload_speed = 921600

; ==============================================================================
; ESP32-C6 esp-hosted link bring-up (Unit PoE P4 + external C6 over SDIO)
; ==============================================================================
; Proves the SDIO link before the main firmware depends on it: setPins → begin →
; prints IP and the host/slave esp-hosted versions. Pins come from network.h
; (Option A). The C6 runs ~/Documents/sensor-station-c6-hosted (esp-hosted 2.11.6).
; Credentials come from the environment, never the repo:
;   C6_TEST_SSID=... C6_TEST_PASS=... pio run -e m5tab5-c6-hosted-test -t upload
; ==============================================================================
[env:m5tab5-c6-hosted-test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino

build_flags =
    -DCONFIG_IDF_TARGET_ESP32P4=1
    -DARDUINO_M5TAB5=1
    -DWIFI_HOSTED=1
    '-DC6_TEST_SSID="${sysenv.C6_TEST_SSID}"'
    '-DC6_TEST_PASS="${sysenv.C6_TEST_PASS}"'
    ; SDIO override (src/hosted_sdio_config.cpp): bench jumper wiring needs
    ; 1-bit at a low clock. Drop both -D flags on a PCB for the 40 MHz 4-bit default.
    -Wl,--wrap=esp_hosted_get_default_sdio_config
    -DC6_SDIO_CLOCK_KHZ=5000
    -DC6_SDIO_BUS_WIDTH=1

build_src_filter = +<samples/c6_hosted_test.cpp> +<hosted_sdio_config.cpp>

monitor_speed = 115200
upload_speed = 921600

; ==============================================================================
; M5Stack Unit PoE P4 (ESP32-P4) environment
; ==============================================================================
; The Unit PoE P4 has a built-in RMII Ethernet MAC (EMAC) connected to an IP101 PHY.
; It has no radio of its own: WiFi/BLE come from an external ESP32-C6 running
; esp-hosted over SDIO (WIFI_HOSTED=1, pins in network.h). Without a C6 fitted
; the firmware runs Ethernet-only. ETHERNET_FIRST_SETUP keeps the first-run
; admin-password page; the provisioning AP only starts if Ethernet has no link.
; ==============================================================================
[env:m5tab5-esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
board_build.partitions = default_16MB.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8.0
    ; M5Unified-ESP32P4 — add back when using M5.Display/M5.Btn/etc.
    ; Requires Python <= 3.13 due to M5GFX build scripts.
    ; file:///home/paulb/M5unified-ESP32P4

build_flags =
    -DCONFIG_IDF_TARGET_ESP32P4=1
    -DM5UNIFIED_ESP32P4_ONLY=1
    -DARDUINO_M5TAB5=1
    ; Thermal detector — enable once M-Bus SPI wiring is confirmed
    ; Suggested pins: -DPIN_MOSI=20 -DPIN_MISO=19 -DPIN_SCLK=18 -DPIN_CS=21
    -DENABLE_THERMAL_DETECTOR=0
    ; LD2450 mmWave radar — set to 1 when sensor is wired via Hat2-Bus
    ; Wiring: Hat2-Bus 5V→VCC, GND→GND, G19←LD2450 TX, G20→LD2450 RX
    -DENABLE_LD2450=0
    ; CC1312R sub-1GHz RF coordinator — set to 1 when LaunchPad XL is wired via SPI
    ; Wiring: G8=MOSI, G9=MISO, G10=CLK, G11=CS, G12=DRDY, 3V3, GND
    -DENABLE_CC1312=1
    ; Log level — 1=error, 2=warn, 3=info (default), 4=debug
    -DLOG_LEVEL=4
    ; WiFi via external ESP32-C6 (esp-hosted, SDIO). C6_* pins default to
    ; pin plan Option A in network.h; override here with -DC6_SDIO_CLK=... etc.
    -DHAS_WIFI=1
    -DWIFI_HOSTED=1
    -DETHERNET_FIRST_SETUP=1
    ; SDIO override (src/hosted_sdio_config.cpp). Bench values for the C6 on
    ; jumper wires: only 1-bit at ~5 MHz is reliable there (Espressif: 4-bit
    ; needs a PCB). Remove the two -D flags on a PCB to get 40 MHz 4-bit.
    -Wl,--wrap=esp_hosted_get_default_sdio_config
    -DC6_SDIO_CLOCK_KHZ=5000
    -DC6_SDIO_BUS_WIDTH=1

; Exclude samples directory from build
build_src_filter = +<*> -<samples/>

monitor_speed = 115200
upload_speed = 921600
